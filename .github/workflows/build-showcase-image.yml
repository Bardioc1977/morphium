name: Build showcase image

# Builds the image of the showcase module (quarkus-morphium-showcase) of the ORIGIN project and pushes it to GHCR. The server updates itself:
# Watchtower there pulls ghcr.io/bardioc1977/quarkus-morphium-showcase:latest as soon as it changes. Nothing of the server (host, user, key) is known to GitHub.
#
# The origin (sboesebeck/morphium) knows nothing about this and holds no token of this account. This workflow asks the origin from the outside, every 20 minutes,
# for the newest commit of BRANCH whose full build (build.yml) succeeded. When there is no image for that commit yet, it builds one.
#
# Note: GitHub switches off scheduled workflows of a public repository after 60 days without activity; a manual run (workflow_dispatch) or any push switches them on again.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit of the origin to build (default: the newest one of the branch whose build succeeded)'
        required: false
      force:
        description: 'Build although an image of this commit exists'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-showcase-image
  cancel-in-progress: false

env:
  ORIGIN: sboesebeck/morphium
  BRANCH: release/7.x
  IMAGE: ghcr.io/bardioc1977/quarkus-morphium-showcase

jobs:
  check:
    name: Which commit?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Newest successful build of the origin, and whether an image exists
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-}"
          if [ -z "$sha" ]; then
            sha=$(gh api "repos/$ORIGIN/actions/workflows/build.yml/runs?branch=$BRANCH&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "No successful build of $BRANCH found (is $BRANCH in the push branches of build.yml of the origin?). Nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "newest successful build: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:sha-$sha" > /dev/null 2>&1 && [ "${INPUT_FORCE:-false}" != "true" ]; then
            echo "An image of this commit exists. Nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push the image
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the origin at the commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ORIGIN }}
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (the context is the root of the origin, the showcase is a module of it)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: quarkus-morphium-showcase/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ needs.check.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.ORIGIN }}
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}
