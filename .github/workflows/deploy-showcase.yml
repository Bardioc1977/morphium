name: Deploy showcase

# Deploys the showcase module (quarkus-morphium-showcase) of the ORIGIN project to the server of this account.
#
# The origin (sboesebeck/morphium) knows nothing about this: nothing is sent there, no token of this account is stored there. This workflow asks
# the origin from the outside, every 20 minutes, for the newest commit of BRANCH whose full build (build.yml) succeeded. When that commit is not the
# one that was deployed last, it builds the image of the showcase from it and deploys it.
#
# The deployment data (host, user, key) exist ONLY as secrets of this repository. Set them as secrets of the ENVIRONMENT "showcase"
# (Settings > Environments > showcase > Environment secrets): then only the job "deploy" can read them.
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
#
# The job that builds code of the origin ("build") has no access to them. The job that uses them ("deploy") runs only what is in THIS repository
# (this file and .github/showcase/docker-compose.prod.yml) and never anything from the origin.
#
# "Which commit is deployed" is recorded as a GitHub deployment of the environment "showcase" (description = the origin commit), written after a
# successful deploy. A failed deploy leaves no record and is tried again at the next poll.
#
# Note: GitHub switches off scheduled workflows of a public repository after 60 days without activity; a manual run (workflow_dispatch) or any push switches them on again.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit of the origin to deploy (default: the newest one of the branch whose build succeeded)'
        required: false
      force:
        description: 'Deploy although this commit is already deployed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-showcase
  cancel-in-progress: false

env:
  ORIGIN: sboesebeck/morphium
  BRANCH: release/7.x
  IMAGE: ghcr.io/bardioc1977/quarkus-morphium-showcase
  APP_DIR: /opt/morphium-showcase

jobs:
  check:
    name: Which commit?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      deploy: ${{ steps.pick.outputs.deploy }}
    steps:
      - name: Newest successful build of the origin, and what is deployed
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-}"
          if [ -z "$sha" ]; then
            sha=$(gh api "repos/$ORIGIN/actions/workflows/build.yml/runs?branch=$BRANCH&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "No successful build of $BRANCH found (is $BRANCH in the push branches of build.yml of the origin?). Nothing to do."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub also creates a deployment for every job that uses an environment, without a description: only ours (description = the origin commit) count
          deployed=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=showcase&per_page=20" --jq '[.[] | select((.description // "") != "")][0].description // empty')
          echo "newest successful build: $sha"
          echo "deployed:                ${deployed:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" != "$deployed" ] || [ "${INPUT_FORCE:-false}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the image (no secrets)
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the origin at the commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ORIGIN }}
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (the context is the root of the origin, the showcase is a module of it)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: quarkus-morphium-showcase/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ needs.check.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.ORIGIN }}
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}

  deploy:
    name: Deploy to the server
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: showcase
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout this repository (only the compose file is used)
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/showcase
          persist-credentials: false

      - name: Copy the compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".github/showcase/docker-compose.prod.yml"
          target: ${{ env.APP_DIR }}/
          strip_components: 2
          overwrite: true

      - name: Restart the showcase
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ needs.check.outputs.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SHA
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            cp -f docker-compose.prod.yml docker-compose.yml
            echo "$SHA" > DEPLOYED_SHA
            docker compose pull showcase
            docker compose up -d
            docker image prune -f

      - name: Record the deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          id=$(jq -n --arg ref "$GITHUB_SHA" --arg sha "$SHA" \
                '{ref: $ref, environment: "showcase", description: $sha, auto_merge: false, required_contexts: [], transient_environment: false, production_environment: true}' \
               | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success -f description="origin $SHA" -f log_url="https://github.com/$ORIGIN/commit/$SHA"
